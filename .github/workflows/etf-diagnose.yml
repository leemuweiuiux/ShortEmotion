name: ETF historical date verification
on:
  push:
    branches: [fix/etf-history-retry]
    paths: [scripts/etf-flow/diagnose.mjs]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/etf-flow/diagnose.mjs
        env:
          WIND_API_KEY: ${{ secrets.WIND_API_KEY }}
