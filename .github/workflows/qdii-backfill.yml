name: QDII backfill (temporary)

on:
  push:
    branches: [backfill/qdii-funds]

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'pypdf==6.14.2'
      - run: python scripts/qdii/scan.py scripts/qdii/scan-output.json 2023-01-01
      - name: Commit output
        run: |
          git add scripts/qdii/scan-output.json
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "QDII scan output"
          git push origin HEAD:backfill/qdii-funds
