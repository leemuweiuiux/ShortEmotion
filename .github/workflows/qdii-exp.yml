name: QDII preview data

on:
  workflow_call:
    secrets:
      WIND_API_KEY:
        required: true
  workflow_dispatch:
  push:
    branches: [exp]
    paths:
      - .github/workflows/qdii-exp.yml
      - scripts/qdii/**

permissions:
  contents: write

concurrency:
  group: qdii-exp-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATA_BRANCH: qdii-exp-data
      DATA_DIR: ${{ github.workspace }}/../qdii-exp-data
    steps:
      - uses: actions/checkout@v4
        with:
          ref: exp
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load last published state
        run: |
          branch=$(git ls-remote --heads origin "refs/heads/$DATA_BRANCH")
          if [ -n "$branch" ]; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git worktree add --detach "$DATA_DIR" FETCH_HEAD
          else
            mkdir -p "$DATA_DIR"
            git -C "$DATA_DIR" init -q
          fi
      - name: Check issuer disclosures
        run: |
          python -m pip install 'pypdf==6.14.2'
          python scripts/qdii/refresh-disclosures.py scripts/qdii/curated.json "$DATA_DIR/curated.json"
      - name: Refresh and settle Nasdaq-100 windows
        run: node scripts/qdii/refresh.mjs "$DATA_DIR/curated.json" "$DATA_DIR/snapshot.json"
        env:
          WIND_API_KEY: ${{ secrets.WIND_API_KEY }}
      - name: Publish preview data
        run: |
          cd "$DATA_DIR"
          printf '%s\n' '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add curated.json snapshot.json vercel.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Update QDII preview data"
          snapshot_commit=$(git rev-parse HEAD)
          git -C "$GITHUB_WORKSPACE" fetch "$DATA_DIR" "$snapshot_commit"
          git -C "$GITHUB_WORKSPACE" push origin "FETCH_HEAD:refs/heads/$DATA_BRANCH"
