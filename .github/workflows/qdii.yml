name: QDII data

on:
  # 准点触发（2026-11-16）：Supabase Cron 北京时间周一至周六 08:20 主取、09:00 备援；GitHub 自带定时只作后备
  schedule:
    - cron: '50 1 * * 1-6' # 北京时间 09:50
  workflow_dispatch:
    inputs:
      slot:
        description: "primary（08:20）/ backup（09:00，当天已是最新则跳过取数）"
        type: choice
        options: [primary, backup]
        default: primary
  push:
    branches: [main]
    paths:
      - .github/workflows/qdii.yml
      - scripts/qdii/**

permissions:
  contents: write

# 与 Exp 的 qdii-exp.yml 共用数据分支，并发组也共用，避免同时推送
concurrency:
  group: qdii-exp-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATA_BRANCH: qdii-exp-data
      DATA_DIR: ${{ github.workspace }}/../qdii-exp-data
      SKIP_FLAG: ${{ (github.event_name == 'schedule' || inputs.slot == 'backup') && '--skip-if-fresh' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Load last published state
        run: |
          branch=$(git ls-remote --heads origin "refs/heads/$DATA_BRANCH")
          if [ -n "$branch" ]; then
            git fetch --depth=1 origin "$DATA_BRANCH"
            git worktree add --detach "$DATA_DIR" FETCH_HEAD
          else
            mkdir -p "$DATA_DIR"
            git -C "$DATA_DIR" init -q
          fi
      - name: Check issuer disclosures
        run: |
          python -m pip install 'pypdf==6.14.2'
          python scripts/qdii/refresh-disclosures.py scripts/qdii/curated.json "$DATA_DIR/curated.json"
      - name: Refresh and settle Nasdaq-100 windows
        run: node scripts/qdii/refresh.mjs "$DATA_DIR/curated.json" "$DATA_DIR/snapshot.json" $SKIP_FLAG
        env:
          WIND_API_KEY: ${{ secrets.WIND_API_KEY }}
      - name: Publish data
        run: |
          cd "$DATA_DIR"
          printf '%s\n' '{"git":{"deploymentEnabled":false}}' > vercel.json
          git add curated.json snapshot.json vercel.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name=github-actions[bot] -c user.email=41898282+github-actions[bot]@users.noreply.github.com commit -qm "Update QDII data"
          snapshot_commit=$(git rev-parse HEAD)
          git -C "$GITHUB_WORKSPACE" fetch "$DATA_DIR" "$snapshot_commit"
          git -C "$GITHUB_WORKSPACE" push origin "FETCH_HEAD:refs/heads/$DATA_BRANCH"
