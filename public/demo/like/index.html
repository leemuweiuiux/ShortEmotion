<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>点赞反馈 Demo</title>
<link rel="icon" href="/favicon.ico">
<style>
/* 基本重置（独立部署用）：与 Claude Artifact 的外壳一致 */
html { box-sizing: border-box; color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<style>
/* Layout: 手机全屏幕只放一张点赞卡片；底部一颗很浅的按钮打开条件菜单（9 种条件 + 重置）。
   这页是测试刺激，固定浅色，不随系统深色模式改变；唯一的颜色是「赞」 */
:root {
  --bg: #FAFAFA;
  --card: #ECECEC;
  --block: #D6D6D6;
  --btn: #DCDCDC;
  --icon: #6E6E6E;
  --ink: #2A2A2A;
  --mute: #767676;
  --like: #F0182A;
  --sheet: #FFFFFF;
  --cell: #F2F2F2;
  --line: #E6E6E6;
  --sel: #1A1A1A;
  --sel-fg: #FFFFFF;
  --faint: #CFCFCF;
  --font: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  color-scheme: light;
}

html, body { height: 100%; }
html { overscroll-behavior: none; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  overflow: hidden;
  touch-action: manipulation;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

.stage {
  height: 100%;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 24px 72px;
}

/* 卡片：全部是灰色占位 */
.card {
  width: 100%;
  max-width: 400px;
  box-sizing: border-box;
  background: var(--card);
  border-radius: 22px;
  padding: 16px 16px 84px;
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.p-head { display: flex; align-items: center; gap: 10px; }
.avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--block); }
.name { width: 56px; height: 12px; border-radius: 6px; background: var(--block); }
.media { aspect-ratio: 258 / 196; max-width: 100%; border-radius: 14px; background: var(--block); }
.acts { display: flex; justify-content: flex-end; gap: 8px; padding: 6px 2px 0 0; }
.slot { width: 44px; height: 44px; border-radius: 12px; background: var(--btn); display: grid; place-items: center; }
.ico { width: 26px; height: 26px; display: block; }
.ico path { fill: none; stroke: var(--icon); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

/* 赞按钮：缺省线性，点赞后面形 */
.like-wrap { position: relative; width: 44px; height: 44px; }
.like {
  width: 44px; height: 44px; padding: 0; border: 0; border-radius: 12px; background: var(--btn);
  display: grid; place-items: center; cursor: pointer; overflow: visible;
}
.like:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
.heart { width: 26px; height: 26px; display: block; color: var(--icon); overflow: visible; }
.heart path { fill: currentColor; fill-opacity: 0; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; }
.heart.red { color: var(--like); }
.heart.red path { fill-opacity: 1; }
.fb-color .heart { transition: color .12s ease; }
.fb-color .heart path { transition: fill-opacity .12s ease; }

/* 反馈：动画 */
.heart.pop { animation: pop 1.2s cubic-bezier(.2, .8, .3, 1.2); }
.heart.pop path { animation: popFill 1.2s ease; }
@keyframes pop {
  0%   { transform: scale(1);    color: var(--icon); }
  22%  { transform: scale(.55);  color: var(--icon); }
  52%  { transform: scale(1.6);  color: var(--like); }
  74%  { transform: scale(.9);   color: var(--like); }
  100% { transform: scale(1);    color: var(--like); }
}
@keyframes popFill { 0% { fill-opacity: 0; } 22% { fill-opacity: 0; } 52% { fill-opacity: 1; } 100% { fill-opacity: 1; } }
.fx { position: absolute; inset: 0; pointer-events: none; }
.dot { position: absolute; left: 50%; top: 50%; border-radius: 50%; opacity: 0; animation: dot var(--d, 1400ms) cubic-bezier(.15, .7, .3, 1) forwards; }
@keyframes dot {
  0%   { opacity: 0; transform: translate(0, 0) scale(.3); }
  18%  { opacity: 1; }
  100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(1); }
}

/* 反馈：文字 */
.plus {
  position: absolute; left: 50%; bottom: 100%; margin-bottom: 8px;
  color: var(--like); font-size: 38px; font-weight: 800; line-height: 1; white-space: nowrap;
  animation: plus 2.4s ease forwards;
}
@keyframes plus {
  0%   { opacity: 0; transform: translate(-50%, 12px) scale(.6); }
  12%  { opacity: 1; transform: translate(-50%, -2px) scale(1.15); }
  22%  { transform: translate(-50%, 0) scale(1); }
  78%  { opacity: 1; transform: translate(-50%, 0) scale(1); }
  100% { opacity: 0; transform: translate(-50%, -10px) scale(1); }
}

/* 底部很浅的菜单按钮 */
.menu-btn {
  position: fixed; left: 50%; bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  width: 64px; height: 40px; margin-left: -32px; padding: 0; border: 0; border-radius: 20px;
  background: transparent; display: grid; place-items: center; cursor: pointer;
}
.menu-btn svg { width: 18px; height: 18px; display: block; }
.menu-btn rect { fill: var(--faint); }
.menu-btn:active { background: rgba(0, 0, 0, .04); }
.menu-btn:focus-visible { outline: 2px solid var(--faint); outline-offset: -2px; }

/* 条件菜单（底部抽屉） */
.scrim { position: fixed; inset: 0; background: rgba(0, 0, 0, .28); opacity: 0; pointer-events: none; transition: opacity .2s ease; }
.sheet {
  position: fixed; left: 0; right: 0; bottom: 0; margin: 0 auto; max-width: 520px; box-sizing: border-box;
  background: var(--sheet); border-radius: 20px 20px 0 0; box-shadow: 0 -10px 30px rgba(0, 0, 0, .08);
  padding-top: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-direction: column; gap: 14px;
  transform: translateY(100%); visibility: hidden;
  transition: transform .26s cubic-bezier(.2, .8, .2, 1), visibility 0s linear .26s;
}
.open .scrim { opacity: 1; pointer-events: auto; }
.open .sheet { transform: translateY(0); visibility: visible; transition: transform .26s cubic-bezier(.2, .8, .2, 1); }
.grabber { width: 36px; height: 4px; border-radius: 2px; background: var(--line); margin: 0 auto; }
.sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.sheet-head h2 { margin: 0; font-size: 16px; font-weight: 600; }
.sheet-head .cur { font-size: 13px; color: var(--mute); }

.matrix { display: grid; grid-template-columns: 40px repeat(3, minmax(0, 1fr)); gap: 8px; align-items: center; }
.matrix .ch { font-size: 12px; color: var(--mute); text-align: center; letter-spacing: .04em; }
.matrix .rh { font-size: 13px; font-weight: 600; }
.cell {
  height: 52px; border: 0; border-radius: 12px; background: var(--cell); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
}
.cell b { font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1; }
.cell span { font-size: 11px; color: var(--mute); }
.cell[aria-pressed="true"] { background: var(--sel); color: var(--sel-fg); }
.cell[aria-pressed="true"] span { color: var(--sel-fg); opacity: .7; }
.cell:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

.reset {
  height: 48px; border: 1px solid var(--line); border-radius: 12px; background: var(--sheet); cursor: pointer;
  display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 15px;
}
.reset svg { width: 16px; height: 16px; }
.reset path { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.reset:active, .cell:active { transform: scale(.97); }
.reset:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
</style>
</head>
<body>
<main class="stage">
  <article class="card" id="card">
    <div class="p-head" aria-hidden="true"><div class="avatar"></div><div class="name"></div></div>
    <div class="media" aria-hidden="true"></div>
    <div class="acts">
      <div class="like-wrap">
        <button type="button" class="like" id="like" aria-pressed="false" aria-label="赞">
          <svg class="heart" id="heart" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.6c-.3 0-.6-.1-.8-.3C8.4 18 3 13.6 3 8.9 3 6.2 5.1 4 7.7 4c1.7 0 3.3.9 4.3 2.3C13 4.9 14.6 4 16.3 4 18.9 4 21 6.2 21 8.9c0 4.7-5.4 9.1-8.2 11.4-.2.2-.5.3-.8.3z"></path></svg>
        </button>
        <div class="fx" id="fx" aria-hidden="true"></div>
      </div>
      <div class="slot" aria-hidden="true">
        <svg class="ico" viewBox="0 0 24 24"><path d="M20 11.5c0 4.1-3.6 7.5-8 7.5-1.2 0-2.4-.3-3.4-.7L4 19.5l1.2-3.6C4.4 14.7 4 13.2 4 11.5 4 7.4 7.6 4 12 4s8 3.4 8 7.5z"></path></svg>
      </div>
      <div class="slot" aria-hidden="true">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 3.5v11M8 7.5l4-4 4 4M5.5 11.5v7a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-7"></path></svg>
      </div>
    </div>
  </article>
</main>

<button type="button" class="menu-btn" id="menuBtn" aria-label="切换条件" aria-expanded="false" aria-controls="sheet">
  <svg viewBox="0 0 18 18" aria-hidden="true">
    <rect x="1" y="1" width="4" height="4" rx="1"></rect><rect x="7" y="1" width="4" height="4" rx="1"></rect><rect x="13" y="1" width="4" height="4" rx="1"></rect>
    <rect x="1" y="7" width="4" height="4" rx="1"></rect><rect x="7" y="7" width="4" height="4" rx="1"></rect><rect x="13" y="7" width="4" height="4" rx="1"></rect>
    <rect x="1" y="13" width="4" height="4" rx="1"></rect><rect x="7" y="13" width="4" height="4" rx="1"></rect><rect x="13" y="13" width="4" height="4" rx="1"></rect>
  </svg>
</button>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="grabber" aria-hidden="true"></div>
  <div class="sheet-head">
    <h2 id="sheetTitle">点赞反馈原型</h2>
    <span class="cur" id="cur">1 · 单击 × 颜色</span>
  </div>
  <div class="matrix">
    <span></span><span class="ch">颜色</span><span class="ch">动画</span><span class="ch">文字</span>
    <span class="rh">单击</span>
    <button type="button" class="cell" data-id="single-color" aria-label="1 单击 × 颜色" aria-pressed="true"><b>1</b><span>颜色</span></button>
    <button type="button" class="cell" data-id="single-anim" aria-label="2 单击 × 动画" aria-pressed="false"><b>2</b><span>动画</span></button>
    <button type="button" class="cell" data-id="single-text" aria-label="3 单击 × 文字" aria-pressed="false"><b>3</b><span>文字</span></button>
    <span class="rh">双击</span>
    <button type="button" class="cell" data-id="double-color" aria-label="4 双击 × 颜色" aria-pressed="false"><b>4</b><span>颜色</span></button>
    <button type="button" class="cell" data-id="double-anim" aria-label="5 双击 × 动画" aria-pressed="false"><b>5</b><span>动画</span></button>
    <button type="button" class="cell" data-id="double-text" aria-label="6 双击 × 文字" aria-pressed="false"><b>6</b><span>文字</span></button>
    <span class="rh">连击</span>
    <button type="button" class="cell" data-id="triple-color" aria-label="7 连击 × 颜色" aria-pressed="false"><b>7</b><span>颜色</span></button>
    <button type="button" class="cell" data-id="triple-anim" aria-label="8 连击 × 动画" aria-pressed="false"><b>8</b><span>动画</span></button>
    <button type="button" class="cell" data-id="triple-text" aria-label="9 连击 × 文字" aria-pressed="false"><b>9</b><span>文字</span></button>
  </div>
  <button type="button" class="reset" id="reset"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8a5 5 0 1 0 1.6-3.7M3 2.5v2.8h2.8"></path></svg>重置</button>
</section>

<script>
(function () {
  var TAPS = { single: 1, double: 2, triple: 3 };
  var TRIG_ZH = { single: '单击', double: '双击', triple: '连击' };
  var FEED_ZH = { color: '颜色', anim: '动画', text: '文字' };
  var ORDER = [
    'single-color', 'single-anim', 'single-text',
    'double-color', 'double-anim', 'double-text',
    'triple-color', 'triple-anim', 'triple-text'
  ];
  var WIN = 350; // 双击、连击：两下之间超过这个间隔（ms）就重新计数
  var DOT_COLORS = ['#F0182A', '#F45B7A', '#D9469B', '#C08AE8', '#F5A04A', '#F7B5C5', '#E8323C'];

  var $ = function (id) { return document.getElementById(id); };
  var card = $('card'), like = $('like'), heart = $('heart'), fx = $('fx');
  var menuBtn = $('menuBtn'), sheet = $('sheet'), scrim = $('scrim');
  var cells = document.querySelectorAll('.cell');

  var cur = null, need = 1, feed = 'color';
  var liked = false, taps = 0, timer = null;

  // iOS Safari 需要有 touchstart 监听，:active 样式才会生效
  document.addEventListener('touchstart', function () {}, { passive: true });

  /* ── 条件 ── */
  function select(id) {
    if (ORDER.indexOf(id) < 0) id = ORDER[0];
    cur = id;
    var parts = id.split('-');
    need = TAPS[parts[0]];
    feed = parts[1];
    card.className = 'card fb-' + feed;
    for (var i = 0; i < cells.length; i++) {
      cells[i].setAttribute('aria-pressed', cells[i].getAttribute('data-id') === id ? 'true' : 'false');
    }
    $('cur').textContent = (ORDER.indexOf(id) + 1) + ' · ' + TRIG_ZH[parts[0]] + ' × ' + FEED_ZH[feed];
    reset();
  }

  function go(id) {
    select(id);
    try { if (location.hash !== '#' + id) location.hash = id; } catch (e) {}
  }

  function reset() {
    clearTimeout(timer);
    taps = 0;
    liked = false;
    like.setAttribute('aria-pressed', 'false');
    heart.classList.remove('red', 'pop');
    fx.innerHTML = '';
  }

  /* ── 反馈 ── */
  function restart(el, cls) {
    el.classList.remove(cls);
    el.getBoundingClientRect();
    el.classList.add(cls);
  }

  function burst() {
    var n = 22;
    for (var i = 0; i < n; i++) {
      var a = (i / n) * Math.PI * 2 + (Math.random() - 0.5) * 0.5;
      var r = 40 + Math.random() * 40;
      var s = 5 + Math.round(Math.random() * 8);
      var d = document.createElement('span');
      d.className = 'dot';
      d.style.width = s + 'px';
      d.style.height = s + 'px';
      d.style.marginLeft = (-s / 2) + 'px';
      d.style.marginTop = (-s / 2) + 'px';
      d.style.background = DOT_COLORS[Math.floor(Math.random() * DOT_COLORS.length)];
      d.style.setProperty('--dx', Math.round(Math.cos(a) * r) + 'px');
      d.style.setProperty('--dy', Math.round(Math.sin(a) * r) + 'px');
      d.style.setProperty('--d', (1200 + Math.round(Math.random() * 600)) + 'ms');
      d.addEventListener('animationend', function () { this.remove(); });
      fx.appendChild(d);
    }
  }

  function plusOne() {
    var p = document.createElement('span');
    p.className = 'plus';
    p.textContent = '+1';
    p.addEventListener('animationend', function () { p.remove(); });
    fx.appendChild(p);
  }

  // 只点赞、不取消：已赞之后再做手势不改变状态（用「重置」回到未赞）
  function doLike() {
    if (liked) return;
    liked = true;
    like.setAttribute('aria-pressed', 'true');
    heart.classList.add('red');
    if (feed === 'anim') { restart(heart, 'pop'); burst(); }
    else if (feed === 'text') { plusOne(); }
  }

  /* ── 手势判定：连点次数达到该条件所需次数时立即触发 ── */
  like.addEventListener('click', function () {
    taps += 1;
    clearTimeout(timer);
    if (taps >= need) {
      taps = 0;
      doLike();
    } else {
      timer = setTimeout(function () { taps = 0; }, WIN);
    }
  });

  /* ── 条件菜单 ── */
  function openSheet() {
    document.body.classList.add('open');
    menuBtn.setAttribute('aria-expanded', 'true');
    var sel = sheet.querySelector('.cell[aria-pressed="true"]');
    setTimeout(function () { if (sel) sel.focus({ preventScroll: true }); }, 30);
  }
  function closeSheet() {
    document.body.classList.remove('open');
    menuBtn.setAttribute('aria-expanded', 'false');
    menuBtn.focus({ preventScroll: true });
  }
  menuBtn.addEventListener('click', openSheet);
  scrim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.body.classList.contains('open')) closeSheet();
  });
  for (var i = 0; i < cells.length; i++) {
    cells[i].addEventListener('click', function () {
      go(this.getAttribute('data-id'));
      setTimeout(closeSheet, 160);
    });
  }
  $('reset').addEventListener('click', function () {
    reset();
    setTimeout(closeSheet, 160);
  });

  window.addEventListener('hashchange', function () {
    var id = location.hash.slice(1);
    if (id && id !== cur) select(id);
  });

  select(location.hash.slice(1));
})();
</script>
</body>
</html>
