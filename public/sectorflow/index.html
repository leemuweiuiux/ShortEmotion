<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>板块资金 · ShortEmotion</title>
  <link rel="icon" href="/short-emotion/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="/short-emotion/logo.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <script>
    // 与看板共用外观设置：深浅色主题与红涨/绿涨配色（twsvp_*）。
    (function () {
      var root = document.documentElement;
      var get = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
      var theme = get("twsvp_theme");
      if (theme !== "light" && theme !== "dark") theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      root.dataset.theme = theme;
      if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#151922");
      if (get("twsvp_price_scheme") === "green_up") {
        root.style.setProperty("--price-up", "#76BB40");
        root.style.setProperty("--price-down", "#FF4015");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/short-emotion/twsvp.css?v=17">
  <link rel="stylesheet" href="/sectorflow/sectorflow.css?v=2">
  <!-- Vercel Web Analytics：只记页面浏览量（不用 cookie），在 Vercel 项目的 Analytics 里查看 -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="nav">
      <a class="nav-logo" href="/home" aria-label="首页"><img src="/short-emotion/logo.svg?v=2" alt="ShortEmotion"></a>
      <div class="nav-title">板块资金</div>
      <button id="account" class="nav-btn" type="button" aria-label="账号" title="账号" aria-haspopup="menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="8.5" r="3.5" stroke="currentColor" stroke-width="1.6"/><path d="M5 19.5c1.2-3.3 3.8-5 7-5s5.8 1.7 7 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </nav>

    <main>
      <section id="sf-empty" class="card">
        <p id="sf-empty-text" class="empty">读取中…</p>
      </section>

      <section id="sf-top-card" class="card" hidden>
        <div class="card-head"><h2 class="card-title">资金流入增速前三</h2><span id="sf-top-pill" class="pill">—</span></div>
        <p id="sf-summary" class="sf-sub"></p>
        <ol id="sf-top" class="sf-top"></ol>
        <p id="sf-top-note" class="sf-note"></p>
      </section>

      <section id="sf-intraday-card" class="card" hidden>
        <div class="card-head"><h2 class="card-title">今日资金趋势</h2><span id="sf-intraday-pill" class="pill">盘中</span></div>
        <p class="sf-sub">累计主力净流入（亿元）</p>
        <div id="sf-intraday" class="sf-chart"></div>
        <div id="sf-intraday-keys" class="sf-keys"></div>
      </section>

      <section id="sf-trend-card" class="card" hidden>
        <div class="card-head">
          <h2 class="card-title">近 20 日资金</h2>
          <div class="sf-seg" role="tablist" aria-label="切换增量与增速">
            <button type="button" role="tab" data-view="amount" aria-selected="true">增量</button>
            <button type="button" role="tab" data-view="accel" aria-selected="false">5日增速</button>
          </div>
        </div>
        <p id="sf-trend-sub" class="sf-sub"></p>
        <div id="sf-trend" class="sf-chart"></div>
        <div id="sf-trend-keys" class="sf-keys"></div>
        <p id="sf-trend-note" class="sf-note"></p>
      </section>

      <section id="sf-table-card" class="card" hidden>
        <div class="card-head"><h2 class="card-title">全部板块</h2><span id="sf-table-pill" class="pill">点选高亮</span><button id="sf-reset" class="sf-link" type="button" hidden>恢复默认</button></div>
        <div class="sf-table-wrap">
          <table class="sf-table">
            <thead><tr>
              <th scope="col" data-sort="name">板块</th>
              <th scope="col" data-sort="streak">连续</th>
              <th scope="col" data-sort="today">今日</th>
              <th scope="col" data-sort="vsAvg" aria-sort="descending">较5日均</th>
              <th scope="col" data-sort="accel">5日增速</th>
            </tr></thead>
            <tbody id="sf-rows"></tbody>
          </table>
        </div>
        <p id="sf-table-note" class="sf-note"></p>
      </section>

      <footer class="legal">
        <p>主力资金为大单与超大单的成交拆单估算。仅用于研究，不构成投资建议。</p>
      </footer>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/sectorflow/sectorflow.js?v=2"></script>
</body>
</html>
