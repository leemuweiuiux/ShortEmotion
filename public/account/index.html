<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>个人资料 · ShortEmotion</title>
  <link rel="icon" href="/short-emotion/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/short-emotion/logo.svg">
  <script>
    // 与介绍页、看板共用外观设置：深浅色跟随系统（或 twsvp_theme），语言：简体 / 繁体
    (function () {
      var root = document.documentElement;
      var get = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
      var theme = get("twsvp_theme");
      if (theme !== "light" && theme !== "dark") theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      root.dataset.theme = theme;
      if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#151922");
      var lang = get("shortemotion:lang");
      if (lang !== "hans" && lang !== "hant") lang = /^zh-(tw|hk|mo|hant)/i.test(navigator.language || "") ? "hant" : "hans";
      root.dataset.lang = lang;
      if (lang === "hant") root.lang = "zh-Hant-TW";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/about/about.css?v=3">
  <link rel="stylesheet" href="/login/login.css?v=1">
  <link rel="stylesheet" href="/account/account.css?v=1">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/about" aria-label="ShortEmotion 介绍">
      <img class="brand-logo" src="/short-emotion/logo.svg" alt="">
      <span class="brand-text">
        <b>ShortEmotion</b>
        <small>看懂A股与台股的短线情绪</small>
      </span>
    </a>
    <div class="lang-toggle" role="group" aria-label="语言">
      <button type="button" class="lang-btn" data-lang="hans">简体</button>
      <span aria-hidden="true">｜</span>
      <button type="button" class="lang-btn" data-lang="hant">繁体</button>
    </div>
  </nav>

  <main class="page login-page">
    <section class="login-card" aria-labelledby="account-title">
      <div class="login-head">
        <h1 id="account-title">个人资料</h1>
        <p>资料只用于和你联系，不会公开显示。</p>
      </div>

      <form id="profile-form" class="login-form" novalidate>
        <label class="field">
          <span>姓名</span>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="40" placeholder="怎么称呼你">
        </label>
        <div class="field">
          <span>邮箱</span>
          <p id="email" class="readonly-value">读取中…</p>
          <small class="field-hint">登录用的邮箱，不能修改。</small>
        </div>
        <div class="field">
          <span id="phone-label">电话</span>
          <div class="phone-row" role="group" aria-labelledby="phone-label">
            <select id="phone-country" name="phoneCountryCode" aria-label="区号">
              <option value="+86">+86 中国大陆</option>
              <option value="+886">+886 台湾</option>
              <option value="+852">+852 香港</option>
              <option value="+853">+853 澳门</option>
              <option value="+65">+65 新加坡</option>
              <option value="+60">+60 马来西亚</option>
              <option value="+81">+81 日本</option>
              <option value="+82">+82 韩国</option>
              <option value="+1">+1 美国／加拿大</option>
              <option value="+44">+44 英国</option>
              <option value="+61">+61 澳大利亚</option>
            </select>
            <input id="phone" name="phoneNumber" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="15" placeholder="手机号">
          </div>
          <small class="field-hint">选填，不需要验证码。</small>
        </div>
        <button id="save" class="primary-btn" type="submit" disabled>保存</button>
      </form>

      <p id="profile-status" class="profile-status" role="status" hidden></p>
      <p id="profile-error" class="login-error" role="alert" hidden></p>

      <div class="account-actions">
        <a class="secondary-btn link-button" href="/shortemotion/cn">返回看板</a>
        <button id="logout" class="secondary-btn" type="button">退出登录</button>
      </div>
    </section>
  </main>

  <script type="module" src="/account/account.js?v=1"></script>
</body>
</html>
