<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>个人页面 · ShortEmotion</title>
  <link rel="icon" href="/short-emotion/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="/short-emotion/logo.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <script>
    // 与介绍页、看板共用外观设置：深浅色跟随系统（或 twsvp_theme），语言：简体 / 繁体
    (function () {
      var root = document.documentElement;
      var get = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
      var theme = get("twsvp_theme");
      if (theme !== "light" && theme !== "dark") theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      root.dataset.theme = theme;
      if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#151922");
      var lang = get("shortemotion:lang");
      if (lang !== "hans" && lang !== "hant") lang = /^zh-(tw|hk|mo|hant)/i.test(navigator.language || "") ? "hant" : "hans";
      root.dataset.lang = lang;
      if (lang === "hant") root.lang = "zh-Hant-TW";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/about/about.css?v=9">
  <link rel="stylesheet" href="/account/account.css?v=9">
  <!-- Vercel Web Analytics：只记页面浏览量（不用 cookie），在 Vercel 项目的 Analytics 里查看 -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="sub-page">
  <nav class="subnav">
    <a id="back" class="subnav-btn" href="/home" aria-label="返回">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="subnav-title">个人页面</div>
  </nav>

  <main class="sub-frame">
    <section class="sub-card">
      <div class="card-row">
        <div class="section-title">个人信息</div>
        <a class="row-link" href="/account/edit">编辑<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>
      <dl class="info-list">
        <div><dt>姓名</dt><dd id="info-name">读取中…</dd></div>
        <div><dt>邮箱</dt><dd id="info-email">读取中…</dd></div>
        <div><dt>电话</dt><dd id="info-phone">读取中…</dd></div>
      </dl>
    </section>

    <section class="sub-card points-card">
      <div class="points-head">
        <div class="points-meta">
          <span>我的积分</span>
          <strong id="points-balance">—</strong>
        </div>
        <button id="signin" class="btn-primary" type="button" disabled>签到 +10</button>
      </div>
      <p id="invite-pending" class="invite-entry-copy" hidden>你是受邀注册的新用户：完成第一次签到，你和邀请人各得 <em>50</em> 积分。</p>
    </section>

    <a class="sub-card invite-entry" href="/account/invite">
      <div class="card-row">
        <div class="section-title">邀请好友</div>
        <span class="row-link">去邀请<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
      </div>
      <p class="invite-entry-copy">好友完成第一次签到，双方各得 <em>50</em> 积分，最多邀请 5 位。</p>
    </a>

    <section class="sub-card appearance-card">
      <div class="section-title">外观</div>
      <div class="theme-switch" role="radiogroup" aria-label="外观">
        <button type="button" role="radio" aria-checked="false" data-theme-choice="light">白版</button>
        <button type="button" role="radio" aria-checked="false" data-theme-choice="dark">黑版</button>
        <button type="button" role="radio" aria-checked="false" data-theme-choice="auto">自适应</button>
      </div>
      <p class="theme-hint">自适应跟随手机或电脑的深浅色设置；只对这台设备的浏览器生效。</p>
    </section>

    <section class="sub-card ledger-card">
      <div class="card-row">
        <div class="section-title">积分流水</div>
        <a class="row-link" href="/account/points">查看全部<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
      </div>
      <ol id="ledger" class="ledger-list"><li class="ledger-empty">读取中…</li></ol>
    </section>

    <button id="logout" class="logout-link" type="button">退出登录</button>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/account/account.js?v=17"></script>
</body>
</html>
