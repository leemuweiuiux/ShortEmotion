<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>编辑个人信息 · ShortEmotion</title>
  <link rel="icon" href="/short-emotion/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="/short-emotion/logo.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <script>
    // 与介绍页、看板共用外观设置：深浅色跟随系统（或 twsvp_theme），语言：简体 / 繁体
    (function () {
      var root = document.documentElement;
      var get = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
      var theme = get("twsvp_theme");
      if (theme !== "light" && theme !== "dark") theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      root.dataset.theme = theme;
      if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#151922");
      var lang = get("shortemotion:lang");
      if (lang !== "hans" && lang !== "hant") lang = /^zh-(tw|hk|mo|hant)/i.test(navigator.language || "") ? "hant" : "hans";
      root.dataset.lang = lang;
      if (lang === "hant") root.lang = "zh-Hant-TW";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/about/about.css?v=9">
  <link rel="stylesheet" href="/account/account.css?v=9">
  <!-- Vercel Web Analytics：只记页面浏览量（不用 cookie），在 Vercel 项目的 Analytics 里查看 -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
</head>
<body class="sub-page">
  <nav class="subnav">
    <a id="back" class="subnav-btn" href="/account" aria-label="返回">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="subnav-title">编辑个人信息</div>
    <button id="save" class="subnav-save" type="button" disabled>保存</button>
  </nav>

  <main class="sub-frame">
    <section class="sub-card">
      <div class="setting-item">
        <div class="setting-meta">
          <strong>邮箱</strong>
          <span id="email">读取中…</span>
        </div>
      </div>
      <form id="profile-form" class="profile-form" novalidate>
        <label class="field">
          <span>姓名</span>
          <input id="name" name="name" type="text" autocomplete="name" maxlength="40" placeholder="输入你的姓名">
        </label>
        <div class="field">
          <span id="phone-label">电话</span>
          <div class="phone-row" role="group" aria-labelledby="phone-label">
            <select id="phone-country" name="phoneCountryCode" aria-label="区号">
              <option value="+86">+86 中国大陆</option>
              <option value="+886">+886 台湾</option>
              <option value="+852">+852 香港</option>
              <option value="+853">+853 澳门</option>
              <option value="+65">+65 新加坡</option>
              <option value="+60">+60 马来西亚</option>
              <option value="+81">+81 日本</option>
              <option value="+82">+82 韩国</option>
              <option value="+1">+1 美国／加拿大</option>
              <option value="+44">+44 英国</option>
              <option value="+61">+61 澳大利亚</option>
            </select>
            <input id="phone" name="phoneNumber" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="15" placeholder="手机号">
          </div>
        </div>
      </form>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/account/edit.js?v=6"></script>
</body>
</html>
