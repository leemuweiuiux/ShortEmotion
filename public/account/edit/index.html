<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>编辑个人信息 · ShortEmotion</title>
  <link rel="icon" href="/short-emotion/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="/short-emotion/logo.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <script>
    // 与介绍页、看板共用外观设置：深浅色跟随系统（或 twsvp_theme），语言：简体 / 繁体
    (function () {
      var root = document.documentElement;
      var get = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
      var theme = get("twsvp_theme");
      if (theme !== "light" && theme !== "dark") theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      root.dataset.theme = theme;
      if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#151922");
      var lang = get("shortemotion:lang");
      if (lang !== "hans" && lang !== "hant") lang = /^zh-(tw|hk|mo|hant)/i.test(navigator.language || "") ? "hant" : "hans";
      root.dataset.lang = lang;
      if (lang === "hant") root.lang = "zh-Hant-TW";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/about/about.css?v=12">
  <link rel="stylesheet" href="/shared/form.css?v=1">
  <link rel="stylesheet" href="/account/account.css?v=14">
  <!-- Vercel Web Analytics：只记页面浏览量（不用 cookie），在 Vercel 项目的 Analytics 里查看 -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <link rel="stylesheet" href="/shared/global-header.css?v=4">
  <script defer src="/shared/usage.js?v=1"></script>
</head>
<body class="sub-page">
  <nav class="subnav">
    <a id="back" class="subnav-btn" href="/account" aria-label="返回">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="subnav-title">编辑个人信息</div>
    <button id="save" class="subnav-save" type="button" disabled>保存</button>
  </nav>

  <main class="sub-frame">
    <section class="sub-card">
      <!-- 昵称：系统随机分配；「换一个」出候选（预览），按右上角「保存」才生效；每 30 天可换一次 -->
      <div class="setting-item nickname-item">
        <div class="setting-meta">
          <strong>昵称</strong>
          <span id="nickname" class="nickname-value">读取中…</span>
          <small id="nickname-hint" class="nickname-hint">系统随机分配，每 30 天可更换一次</small>
        </div>
        <button id="nickname-shuffle" class="btn-secondary nickname-shuffle" type="button" disabled>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 0 0-14.7-4.3M4 5v4h4M4 13a8 8 0 0 0 14.7 4.3M20 19v-4h-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>换一个</span>
        </button>
      </div>
      <div class="setting-item">
        <div class="setting-meta">
          <strong>邮箱</strong>
          <span id="email">读取中…</span>
        </div>
      </div>
      <form id="profile-form" class="profile-form" novalidate>
        <div class="field">
          <span id="phone-label">电话</span>
          <div class="phone-row" role="group" aria-labelledby="phone-label">
            <select id="phone-country" class="se-input" name="phoneCountryCode" aria-label="区号">
              <option value="+86">+86</option>
              <option value="+886">+886</option>
              <option value="+852">+852</option>
              <option value="+853">+853</option>
              <option value="+65">+65</option>
              <option value="+60">+60</option>
              <option value="+81">+81</option>
              <option value="+82">+82</option>
              <option value="+1">+1</option>
              <option value="+44">+44</option>
              <option value="+61">+61</option>
            </select>
            <input id="phone" class="se-input" name="phoneNumber" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="15" placeholder="手机号">
          </div>
        </div>
      </form>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="/account/edit.js?v=11"></script>
  <script type="module" src="/shared/global-header.js?v=4"></script>
</body>
</html>
