<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>邀请好友 · ShortEmotion</title>
  <link rel="icon" href="/short-emotion/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="/short-emotion/logo.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <script>
    // 与介绍页、看板共用外观设置：深浅色跟随系统（或 twsvp_theme），语言：简体 / 繁体
    (function () {
      var root = document.documentElement;
      var get = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
      var theme = get("twsvp_theme");
      if (theme !== "light" && theme !== "dark") theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      root.dataset.theme = theme;
      if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#151922");
      var lang = get("shortemotion:lang");
      if (lang !== "hans" && lang !== "hant") lang = /^zh-(tw|hk|mo|hant)/i.test(navigator.language || "") ? "hant" : "hans";
      root.dataset.lang = lang;
      if (lang === "hant") root.lang = "zh-Hant-TW";
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/about/about.css?v=11">
  <link rel="stylesheet" href="/shared/form.css?v=1">
  <link rel="stylesheet" href="/account/account.css?v=14">
  <!-- Vercel Web Analytics：只记页面浏览量（不用 cookie），在 Vercel 项目的 Analytics 里查看 -->
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <link rel="stylesheet" href="/shared/global-header.css?v=2">
</head>
<body class="sub-page">
  <nav class="subnav">
    <a class="subnav-btn" href="/account" aria-label="返回">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </a>
    <div class="subnav-title">邀请好友</div>
  </nav>

  <main class="sub-frame">
    <section class="sub-card invite-main">
      <!-- 邀请卡：页面上预览，「分享邀请卡」时按同样内容生成图片（只有邀请卡显示邀请码） -->
      <div id="invite-card" class="invite-card">
        <div class="ic-brand">
          <img src="/short-emotion/logo.svg?v=2" alt="">
          <span><b>ShortEmotion</b><small>看懂A股情绪与走势</small></span>
        </div>
        <p class="ic-title"><b id="ic-name">好友</b><span>邀请你加入</span></p>
        <p class="ic-reward">注册并完成首次签到，双方各得 <em>50</em> 积分</p>
        <ul class="ic-features"><li>短线情绪</li><li>题材异动</li><li>个股技术分析</li></ul>
        <div class="ic-code">
          <div class="ic-code-text">
            <span>邀请码</span>
            <strong id="ic-code">——</strong>
            <small>扫码注册，或填写邀请码</small>
          </div>
          <div id="ic-qr" class="ic-qr" aria-label="邀请链接二维码"></div>
        </div>
        <p class="ic-foot">lfjmwl.com · 仅用于研究与情绪观察，不构成投资建议</p>
      </div>

      <div class="invite-actions">
        <button id="share-card" class="btn-primary" type="button" disabled>分享邀请卡</button>
        <button id="copy-link" class="btn-secondary" type="button" disabled>复制邀请链接</button>
      </div>
      <p id="invite-link" class="invite-link"></p>
    </section>

    <section class="sub-card">
      <div class="section-title">邀请记录</div>
      <div class="invite-stats">
        <div><span>已邀请</span><strong id="stat-invited">—</strong></div>
        <div><span>已完成签到</span><strong id="stat-rewarded">—</strong></div>
        <div><span>累计获得积分</span><strong id="stat-earned">—</strong></div>
      </div>
      <ol id="friends" class="ledger-list friend-list"><li class="ledger-empty">读取中…</li></ol>
    </section>

    <section class="sub-card">
      <div class="section-title">规则</div>
      <ol class="invite-rules">
        <li>好友打开你的邀请链接或扫邀请卡上的二维码注册，也可以在登录页填你的邀请码。</li>
        <li>好友完成第一次签到后，你和好友各得 50 积分。</li>
        <li>每人最多邀请 5 位好友；邀请码只限新注册的账号使用。</li>
      </ol>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="/short-emotion/vendor/qrcode-generator.js" defer></script>
  <script src="/short-emotion/vendor/html-to-image.js" defer></script>
  <script type="module" src="/account/invite.js?v=7"></script>
  <script type="module" src="/shared/global-header.js?v=2"></script>
</body>
</html>
