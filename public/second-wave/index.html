<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="robots" content="noindex">
  <title>题材二波 · Market Emotion</title>
  <link rel="icon" href="/short-emotion/favicon-32.png?v=2" type="image/png" sizes="32x32">
  <link rel="icon" href="/short-emotion/logo.svg?v=2" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
  <script>
    // 与看板共用外观设置：深浅色主题与红涨/绿涨配色（twsvp_*）。
    (function () {
      var root = document.documentElement;
      var get = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
      var theme = get("twsvp_theme");
      if (theme !== "light" && theme !== "dark") theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      root.dataset.theme = theme;
      if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#151922");
      if (get("twsvp_price_scheme") === "green_up") {
        root.style.setProperty("--price-up", "#76BB40");
        root.style.setProperty("--price-down", "#FF4015");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="/short-emotion/twsvp.css?v=18">
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>
  <link rel="stylesheet" href="/shared/global-header.css?v=5">
  <script defer src="/shared/usage.js?v=3"></script>
  <link rel="stylesheet" href="/shared/wide-layout.css?v=4">
  <link rel="stylesheet" href="/second-wave/second-wave.css?v=4">
</head>
<body class="wide-page wide-second-wave">
  <div class="app-shell">
    <nav class="nav" aria-label="页面导航">
      <a class="nav-logo" href="/home" aria-label="首页"><img src="/short-emotion/logo.svg?v=2" alt="Market Emotion"></a>
      <div class="nav-title">题材二波</div>
    </nav>
    <main class="sw-page">
      <section class="card" aria-labelledby="sw-title">
        <div class="card-head"><h1 id="sw-title" class="card-title">题材二波形态</h1><div class="sw-head-actions"><span id="sw-date" class="pill">读取中</span><div class="sw-share-wrap"><button id="sw-export" class="nav-btn" type="button" aria-label="导出分享" title="导出分享" aria-haspopup="menu" aria-expanded="false" disabled><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M12 4v11M7.5 8.5 12 4l4.5 4.5M5 13v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div></div></div>
        <p class="card-desc">从热门概念指数里找「第一波放量后缩量、跌得比大盘少、再度放量」的题材。</p>
        <p id="sw-meta" class="sw-market"></p>
        <div id="sw-bench" class="sw-bench" aria-label="大盘基准"></div>
        <div id="sw-kpis" class="sw-kpis" role="group" aria-label="按分档筛选"></div>
        <p id="sw-note" class="sw-note" hidden></p>
      </section>
      <section class="card" aria-labelledby="sw-bubble-title">
        <div class="card-head"><h2 id="sw-bubble-title" class="card-title">缩量质量 × 抗跌度</h2></div>
        <p class="card-desc">只看已启动与待确认。圆点大小为成交额，越靠右上，缩量越充分、越抗跌。</p>
        <div id="sw-bubble" class="sw-bubble"></div>
        <div class="sw-legend"><span><i data-band="已启动"></i>已启动</span><span><i data-band="待确认"></i>待确认</span></div>
      </section>
      <section class="card" aria-labelledby="sw-list-title">
        <div class="card-head"><h2 id="sw-list-title" class="card-title">指数列表</h2><span id="sw-count" class="pill"></span></div>
        <div class="sw-tools">
          <div id="sw-filter" class="sw-filter" role="group" aria-label="分档"></div>
          <div class="sw-tools-row">
            <input id="sw-search" class="sw-search" type="search" placeholder="搜索指数或代码" aria-label="搜索指数或代码">
            <select id="sw-sort" class="sw-sort" aria-label="排序">
              <option value="band">分档优先</option><option value="score">总分</option><option value="shrink">缩量质量</option>
              <option value="resilience">抗跌度</option><option value="ignition">放量比</option><option value="amt">成交额</option><option value="chg">当日涨跌</option>
            </select>
          </div>
        </div>
        <ol id="sw-list" class="sw-list" aria-live="polite"><li class="loading">正在读取题材二波…</li></ol>
      </section>
      <section class="card" aria-labelledby="sw-track-title">
        <div class="card-head"><h2 id="sw-track-title" class="card-title">跟踪清单</h2></div>
        <p class="card-desc">每个待确认指数要放量到多少、涨多少，才算二波启动。</p>
        <div id="sw-track" class="sw-track"></div>
      </section>
      <section class="card">
        <details class="sw-help">
          <summary>怎么看</summary>
          <ul>
            <li><b>已启动</b>：第一波之后先缩量，再度放量上涨，且量能已经确认。</li>
            <li><b>待确认</b>：缩量已经到位、走势比大盘抗跌，等待再度放量。</li>
            <li>点任一指数可以看近 25 个交易日的成交额与涨跌幅，以及各项明细。</li>
          </ul>
        </details>
      </section>
    </main>
  </div>
  <div id="sw-sheet" class="sw-sheet" hidden>
    <div class="sw-sheet-bg" data-close></div>
    <section class="sw-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sw-sheet-title">
      <div class="sw-sheet-head"><div><h2 id="sw-sheet-title">—</h2><small id="sw-sheet-code"></small></div><button class="nav-btn" type="button" data-close aria-label="关闭">×</button></div>
      <div id="sw-sheet-body" class="sw-sheet-body"></div>
    </section>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script type="module" src="/shared/global-header.js?v=9"></script>
  <script type="module" src="/second-wave/second-wave.js?v=5"></script>
</body>
</html>
