  <script>
    // 与看板共用外观设置：深浅色主题与红涨/绿涨配色（twsvp_*）。
    (function () {
      var root = document.documentElement;
      var get = function (key) { try { return localStorage.getItem(key); } catch (e) { return null; } };
      var theme = get("twsvp_theme");
      if (theme !== "light" && theme !== "dark") theme = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      root.dataset.theme = theme;
      if (theme === "dark") document.querySelector('meta[name="theme-color"]').setAttribute("content", "#151922");
      if (get("twsvp_price_scheme") === "green_up") {
        root.style.setProperty("--price-up", "#76BB40");
        root.style.setProperty("--price-down", "#FF4015");
      }
      root.dataset.lang = "hans"; // 仅提供简体
    })();
  </script>

    <main class="wide-home-grid">
      <section id="anomaly-card" class="card home-card home-anomaly">

        <div class="home-card-body"><div class="home-card-meta"><span id="anomaly-pill" class="pill">读取中</span></div>
        <p class="card-desc">按涨停点火、批量拉升与消息催化筛出的高价值题材方向。</p>
        <div id="anomaly-body" class="home-anomaly-body"><div class="loading">正在读取题材异动…</div></div></div>
      </section>

      <section id="limitup-card" class="card home-card home-limitup">

          <div><span>跌停</span><b id="limitup-down" class="down-text">—</b></div>
          <div><span>最高板</span><b id="limitup-max">—</b></div>
          <div><span>晋级率</span><b id="limitup-promo">—</b></div>
        </div>
        <div id="limitup-ladder" class="home-limitup-body"><div class="loading">正在读取涨停天梯…</div></div>
        <span id="limitup-time" class="home-time"></span></div>
      </section>
      <section id="secondwave-card" class="card home-card home-secondwave" aria-labelledby="home-sw-title" hidden>
        <div class="card-head"><h2 id="home-sw-title" class="card-title"><a href="/secondwave">题材二波</a></h2><a class="home-more" href="/secondwave" aria-label="查看更多题材二波">查看更多<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 6 6 6-6 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>
        <div class="home-card-body"><div class="home-card-meta"><span id="sw-home-pill" class="pill">读取中</span></div>
        <p class="card-desc">第一波放量后缩量、比大盘抗跌、等待再度放量的概念指数。</p>

          <div><span>待确认</span><b id="sw-home-watch">—</b></div>
        </div>
        <div id="sw-home-body" class="home-anomaly-body"><div class="loading">正在读取题材二波…</div></div></div>
      </section>
      <footer class="legal">
        <p>仅用于研究与情绪观察，不构成投资建议。</p>
      </footer>
