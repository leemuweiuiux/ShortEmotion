plugins { id 'com.android.application' }
android {
    namespace 'com.lfjmwl.shortemotion'
    compileSdk 35
    defaultConfig {
        applicationId 'com.lfjmwl.shortemotion'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    def signingPath = System.getenv('ANDROID_KEYSTORE_PATH')
    signingConfigs {
        release {
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.debug'; versionNameSuffix '-debug' }
        release { signingConfig signingConfigs.release; minifyEnabled false }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
tasks.configureEach {
    if (name == 'validateSigningRelease') doFirst {
        if (!System.getenv('ANDROID_KEYSTORE_PATH')) throw new GradleException('Release signing requires ANDROID_KEYSTORE_PATH and signing credentials. Never publish a debug APK.')
    }
}
